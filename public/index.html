<!DOCTYPE html>
<html lang = "ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GPX経路分析</title>
        <link rel="stylesheet" href="style.css">            
                
    </head>
    <body>
        <h1>GPXデータ解析と経路判定</h1>

        <!-- 1. GPXインポートエリア -->
        <div class="card-panel">
            <p style="margin-top: 0; font-weight:bold;">過去のログを読み込む</p>
            <input type="file" id="gpxFileInput" multiple accept=".gpx">
            <button onclick="processFiles()" id="processButton" class="btn btn-primary">
                GPXファイルをデータベースに保存
            </button>

        </div>

        <!-- 2. 検索・ナビ操作エリア -->
        <div class="card-panel">
            <div class="search-box">
                <div class="search-input-wrapper">
                    <input type="text" id="destinationInput" placeholder="目的地を入力（例：東京タワー）">
                    <button class="btn-clear-input" onclick="clearDestinationInputOnly()">×</button>
                </div>
                <button onclick="requestRouteDrawing()" id="drawingButton" class="btn btn-primary">
                    ルート検索    
                </button>
            </div>

            <div id="navControls">
                <button onclick="startNavigation()" id="routestartButton" class="btn btn-success" style="display:none;">
                    ナビ開始    
                </button>   
                <button onclick="stopNavigation()" id="stopButton" class="btn btn-danger" style="display:none;">
                    ナビ停止
                </button>
                <button onclick="startNavigation()" id="startButton" class="btn btn-success" style="display:none;">
                    ナビ再開
                </button>
                <button onclick="resumeAutoFollow()" class="btn btn-secondary">
                    現在地に戻る
                </button> 
                <button id="clearAllButton" onclick="clearAllNavigation()" class="btn btn-danger">
                    すべて消去
                </button>
            </div>

            <div id="statusLabel" class="card-panel" style="margin-top:10px; background:#f0f0f0;">
                状態：待機中
            </div>
        </div>

        <!-- 3. ナビ案内パネル -->
        <div id="nav-panel" style="display: none;">
            <div id="nav-instruction"></div>
            <div id="nav-distance"></div>    
        </div>

        <!-- 4. メインマップ -->
        <div id="map"></div>

        <!-- 5. ステップ表示 -->
        <div id="routeStepsContainer" class="card-panel" style="display: none;">
            <h3>選択中の経路</h3>
            <ol id="routeStepsList"></ol>
        </div>

        <!-- 6. デバッグログ（開閉トグル付き） -->
        <div id="logPanel" class="card-panel">
            <div id="logPanelHeader" onclick="toggleLogDisplay()">
                <span style="font-size: 0.85em; color: #666;">動作ログ</span>
                <button class="btn btn-secondary" style="padding: 2px 8px; font-size:11px;">表示/非表示</button>
            </div>
            <div id="log"></div>
        </div>

        <!-- JSスクリプトの読み込み -->
        <script src="utils.js"></script>
        <script src="gpx-parser.js"></script>
        <script src="gpx-analyzer.js"></script>
        <script src="navigation.js"></script>
        <script src="route.check.js"></script>
        <script src="location-tracker.js"></script>
        <script src="map.renderer.js"></script>
        <script src="app.js"></script>
    </body>
</html>
